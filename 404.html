<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Saviya</title>
    <script>
      // GitHub Pages 404 redirect for React Router (single-page apps)
      // Converts the 404 URL into a query string and redirects to index.html
      // so React Router can handle it client-side.
      var segmentCount = 1; // number of path segments in the base URL (/saviya = 1)
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
